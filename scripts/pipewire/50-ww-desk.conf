# web-wayland 桌面音频：虚拟输出 sink（ww-desk）
#
# 为什么不用硬件 sink：本机 ALC3246 默认开启 Loopback Mixing，麦克风会被混进
# 扬声器输出，硬件 sink 的 monitor 实际是「麦克风 + 环境声」，客户端会听到服务器
# 麦克风，扬声器与内置麦还会形成声学回环持续蜂鸣。
#
# 这个 null sink 设为默认输出后，应用声音只进虚拟设备，与硬件声卡、麦克风彻底隔离。
# 安装位置：~/.config/pipewire/pipewire.conf.d/
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "ww-desk"
          node.description = "web-wayland 桌面音频"
          media.class      = "Audio/Sink"
          audio.position   = "FL,FR"
          monitor.channel-volumes = true
      }
    }
]
