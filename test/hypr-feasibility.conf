# 可行性验证配置：无物理输出时由 prepareFallbackOutput 自动建 headless 输出
# 不写 monitor 行，让 Hyprland 自己决定 FALLBACK 输出（1920x1080@60）
misc {
    paint_cursors = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

debug {
    disable_logs = false
}
