# iGPU 直连测试配置：X11/SDDM 已停，card1(i915) 空闲，Hyprland 直接接管 eDP-1
monitor = eDP-1, preferred, auto, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

debug {
    disable_logs = false
}
