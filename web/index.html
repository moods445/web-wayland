<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web Wayland 桌面</title>
<link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <!-- 串流层：全屏画布 + 光标层，进入后不得有任何装饰 -->
  <div id="stage" class="hidden">
    <canvas id="screen"></canvas>
    <div id="cursor" class="cursor hidden"></div>

    <!-- 客户端串流设置（只影响本机这条连接，不改远端桌面配置） -->
    <button id="gear" class="gear" title="串流设置">&#9881;</button>
    <div id="settings" class="settings hidden">
      <div class="settings-title">串流设置</div>

      <label class="settings-row">
        <span>分辨率</span>
        <select id="set-res">
          <option value="auto">自动（跟随窗口）</option>
          <option value="1920x1080">1920 × 1080</option>
          <option value="2560x1440">2560 × 1440</option>
          <option value="3200x1800">3200 × 1800</option>
          <option value="3840x2160">3840 × 2160（4K）</option>
        </select>
      </label>

      <label class="settings-row">
        <span>帧率</span>
        <select id="set-fps">
          <option value="0">自动</option>
          <option value="30">30 fps</option>
          <option value="45">45 fps</option>
          <option value="60">60 fps</option>
        </select>
      </label>

      <label class="settings-row">
        <span>编码器</span>
        <select id="set-enc">
          <option value="vaapi">集显 VAAPI（省电）</option>
          <option value="nvenc">独显 NVENC（更快）</option>
        </select>
      </label>

      <label class="settings-row check">
        <span>状态叠层</span>
        <input type="checkbox" id="set-hud">
      </label>

      <div class="settings-actions">
        <button id="set-fs" class="mini">切换全屏</button>
        <button id="set-close" class="mini ghost">关闭</button>
      </div>

      <div class="settings-note" id="set-note">—</div>
    </div>
    <div id="hud" class="hud hidden">
      <div class="hud-title">串流状态</div>
      <dl>
        <div><dt>码率</dt><dd id="hud-bitrate">—</dd></div>
        <div><dt>帧率</dt><dd id="hud-fps">—</dd></div>
        <div><dt>分辨率</dt><dd id="hud-res">—</dd></div>
        <div><dt>端到端</dt><dd id="hud-latency">—</dd></div>
        <div><dt>档位</dt><dd id="hud-tier">—</dd></div>
      </dl>
      <div class="hud-hint">Ctrl+Alt+F1 隐藏</div>
    </div>
  </div>

  <!-- 连接页：唯一有排版的界面 -->
  <main id="connect" class="connect">
    <div class="card">
      <div class="brand">
        <span class="dot"></span>
        <h1>Web Wayland</h1>
      </div>
      <p class="sub">浏览器里的 Hyprland 桌面 · 局域网直连</p>

      <div class="addr">
        <code id="server-addr">192.168.0.109:8443</code>
        <button id="copy-addr" title="复制">复制</button>
      </div>

      <ol class="steps" id="steps">
        <li data-step="0"><i></i><span>建立 WebTransport 通道</span></li>
        <li data-step="1"><i></i><span>获取首帧</span></li>
        <li data-step="2"><i></i><span>就绪</span></li>
      </ol>

      <div class="actions">
        <button id="enter" class="primary">进入桌面</button>
        <button id="enter-fs" class="ghost">全屏进入</button>
      </div>

      <ul class="errors hidden" id="errors"></ul>
      <p class="hint">进入后按 <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>F1</kbd> 查看性能叠层</p>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
