# 显示器配置（由 scripts/switch-display.sh 或 scripts/sunshine-wayland.sh mode 写入，手改也可以）
# 格式：monitor = 名称, 分辨率@刷新率, XxY, 缩放
#
# 默认档位：1920x1080@60 + **scale 1** → 逻辑 1920×1080，客户端 1:1 像素，最清晰。
# 觉得字/图标小不要靠 scale 2 或分数缩放去放大：那会让画面多一次重采样，文字发虚。
# 正确做法是只放大字号（GTK/foot/fuzzel/waybar/光标一起）：scripts/font-scale.sh [1.0|1.15|1.3|1.45]
#
# 注意：虚拟输出的尺寸只能在创建时定，改完要重跑 mode（新建输出→删旧输出→重启 Sunshine）；
# 直接 hyprctl keyword monitor 改不动尺寸。
monitor = HEADLESS-2, 1920x1080@60, 0x0, 1
