# web-wayland 桌面会话配置（Hyprland 0.55）
# 运行形态：iGPU (card1 / renderD129) 上只保留虚拟输出 HEADLESS-*，Moonlight 通过串流访问

# ── 输出 ───────────────────────────────────────────────────────────────
# 物理屏 eDP-1 不参与桌面：串流只用虚拟输出 HEADLESS-*，面板保持黑屏。
# 需要临时看本地面板：scripts/physical-screen.sh on（默认 5 分钟，到点自动恢复禁用；
# 用 preferred=原生 3840x2160，1920x1080 点了不亮）；恢复：physical-screen.sh off。
# 永久禁止 safe-mode 点亮面板由 physical-screen-off.service + .timer 兜底（见 docs/sunshine-moonlight.md §13）。
monitor = eDP-1, disable

# 分辨率/位置/缩放由 nwg-displays 维护并导出到这里
source = ~/.config/hypr/monitors.conf

# ── 外观：对标 Hyprland 默认观感 ────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(5aa9ffee) rgba(7c5cffee) 45deg
    col.inactive_border = rgba(ffffff22)
    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.98

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    animation = windows, 1, 6, wind
    animation = windowsIn, 1, 6, winIn, popin 80%
    animation = windowsOut, 1, 5, default, popin 80%
    animation = fade, 1, 8, default
    animation = workspaces, 1, 6, wind
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ── 行为 ──────────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

input {
    kb_layout = us
    follow_mouse = 1
    # 远程串流必须关闭指针加速：否则相对位移会被非线性放大，绝对定位无法对齐
    sensitivity = 0
    accel_profile = flat
    force_no_accel = true

    touchpad {
        natural_scroll = true
    }
}

xwayland {
    # 纯 Wayland 部署（2026-11-21）：不需要 X11，`Xwayland` 一并关掉。
    # 关掉后 `DISPLAY` 相关的东西（xset/xdotool/X11 版输入法/Chrome 的 x11 后端）
    # 全部不可用；需要时临时把自己改成 true 再 `hyprctl reload` 并重启会话。
    enabled = false
}

cursor {
    # 指针交给合成器画，并且要**可见**：Sunshine 的 wlr 抓帧带 overlay_cursor，
    # Moonlight 看到的就是视频里的光标。已废弃的全透明主题 ww-invisible
    # 在这里必须去掉（否则串流里根本没有鼠标指针），hyprcursor 也就恢复正常。
    no_hardware_cursors = false
    enable_hyprcursor = true
    # 指针大小不在这里配：Hyprland 没有 cursor:size 选项（hyprctl getoption 报 no such option），
    # 只能靠启动时的 XCURSOR_SIZE / HYPRCURSOR_SIZE 环境变量，见 scripts/ww-session.service
    # （scripts/font-scale.sh 会按字号档位同步改那两个变量值）。
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ── 生态组件随会话启动 ────────────────────────────────────────────────
exec-once = waybar
# 壁纸用 swaybg（hyprpaper 0.8.4 在本机 headless 输出上不生效）
exec-once = swaybg -i @WALLPAPER@ -m fill

# ── 键位（SUPER 为 mod，对标 Hyprland 默认体系）───────────────────────
$mod = SUPER

bind = $mod, Return, exec, foot
bind = $mod, D, exec, fuzzel
bind = $mod SHIFT, D, exec, nwg-displays
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, TAB, cyclenext
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# 音量（一期无音频，先绑好，后续接 PipeWire 直接可用）
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
