# web-wayland 应用启动器（fuzzel）：居中模糊浮层 + 键盘导航
font=Noto Sans CJK SC:size=11
dpi-aware=no

[main]
prompt="  搜索  "
icons-enabled=yes
terminal=foot
lines=10
width=44
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=26
match-mode=fzf

[colors]
background=0b0b0fee
text=e6e6ecff
match=5aa9ffff
selection=5aa9ff28
selection-text=ffffffff
selection-match=5aa9ffff
counter=9a9aa8ff
border=ffffff1a

[border]
width=1
radius=12
