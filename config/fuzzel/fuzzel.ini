# web-wayland 应用启动器（fuzzel）：居中模糊浮层 + 键盘导航
# 字号 14pt 是 1080p@1x 的默认档（scripts/font-scale.sh 1.3）；不要靠 Hyprland scale 放大
font=Noto Sans CJK SC:size=14
dpi-aware=no

[main]
prompt="  搜索  "
icons-enabled=yes
terminal=foot
lines=10
width=44
horizontal-pad=23
vertical-pad=18
inner-pad=13
line-height=34
match-mode=fzf

[colors]
background=0b0b0fee
text=e6e6ecff
match=5aa9ffff
selection=5aa9ff28
selection-text=ffffffff
selection-match=5aa9ffff
counter=9a9aa8ff
border=ffffff1a

[border]
width=1
radius=12
