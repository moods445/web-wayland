[package]
name = "wwgw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wwgw"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
wtransport = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
anyhow = "1"
